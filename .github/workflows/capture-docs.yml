name: Capture Documentation Media

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture-media:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Playwright & Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Ensure ffmpeg is installed
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Capture screenshots & animated WebP clips
        run: npm run docs:capture

      - name: Commit updated docs/media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/media
          if git diff --cached --quiet; then
            echo "No documentation media changes detected."
          else
            git commit -m "docs: refresh generated screenshots and animations"
            git push
          fi
