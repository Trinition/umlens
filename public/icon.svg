<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="handle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glass" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#bae6fd" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.32"/>
    </radialGradient>
  </defs>

  <!-- Handle -->
  <g transform="rotate(45 345 345)">
    <rect x="330" y="315" width="34" height="32" rx="4" fill="#94a3b8" stroke="#0f172a" stroke-width="5"/>
    <rect x="322" y="342" width="50" height="145" rx="22" fill="url(#handle)" stroke="#0f172a" stroke-width="6"/>
    <line x1="336" y1="358" x2="336" y2="468" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- Translucent Glass Lens -->
  <circle cx="215" cy="215" r="158" fill="url(#glass)"/>

  <!-- Glass Glare Highlight -->
  <path d="M 105 165 A 120 120 0 0 1 255 95 A 135 135 0 0 0 105 165 Z" fill="#ffffff" opacity="0.55"/>

  <!-- Outer & Inner Metallic Bezel -->
  <circle cx="215" cy="215" r="164" fill="none" stroke="#0f172a" stroke-width="7"/>
  <circle cx="215" cy="215" r="154" fill="none" stroke="url(#rim)" stroke-width="18"/>
  <circle cx="215" cy="215" r="144" fill="none" stroke="#0f172a" stroke-width="5"/>

  <!-- High-Contrast UML Text (White fill + dark stroke for any background) -->
  <text x="215" y="244"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-weight="900"
        font-size="96"
        letter-spacing="2"
        text-anchor="middle"
        fill="#ffffff"
        stroke="#0f172a"
        stroke-width="14"
        paint-order="stroke fill"
        stroke-linejoin="round">UML</text>
</svg>
